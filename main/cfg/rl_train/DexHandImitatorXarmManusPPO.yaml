# xArm-mounted Stage 1 PPO config. Differences vs DexHandImitatorManusPPO:
#
# 1. `mu_activation: Tanh` — policy mean is clamped to [-1, 1] inside the
#    network. The original config (mu_activation: None) lets mu drift
#    arbitrarily large, and with the xarm 27-D direct action space the
#    bounds_loss penalty (coef 1e-4) is too weak to pull it back. Result on
#    the previous run: bounds_loss climbed 0 -> 22, KL spiked, the adaptive
#    LR scheduler halved LR every iter until it hit ~0 by iter 500 — policy
#    frozen, reward stuck at ~22.
# 2. `mu_init: glorot_normal_initializer gain=0.01` — small initial weights
#    so mu starts near 0. Otherwise even with tanh, the network's tanh
#    saturates at startup and gradients vanish.
# 3. `bounds_loss_coef: 0.01` (was 1e-4) — belt-and-suspenders. With tanh
#    in place the bounds penalty rarely fires, but if it does the response
#    is meaningful.
#
# Everything else mirrors DexHandImitatorManusPPO: same network sizes, same
# obs / target dims, same KL/horizon/etc.
params:
  seed: ${...seed}
  algo:
    name: ppo

  model:
    name: ${is_sep_model:${....bimanual_mode},my_continuous_a2c_logstd}

  network:
    name: ${is_sep_model:${....bimanual_mode},dict_obs_actor_critic}
    separate: False

    space:
      continuous:
        mu_activation: tanh
        sigma_activation: None
        mu_init:
          name: glorot_normal_initializer
          gain: 0.01
        sigma_init:
          name: const_initializer
          val: 0
        fixed_sigma: True

    dict_feature_encoder:
      _target_: lib.nn.features.SimpleFeatureFusion
      extractors:
        privileged:
          _target_: lib.nn.features.Identity
          input_dim: ${is_united_model:${.......bimanual_mode},${.......side},${eval:'13+${ndof:${.....dexhand}}*3'}}
        proprioception:
          _target_: lib.nn.features.Identity
          input_dim: ${is_united_model:${.......bimanual_mode},${.......side},${ndof:${.....dexhand}}}
        target:
          _target_: lib.nn.features.Identity
          input_dim: ${is_united_model:${.......bimanual_mode},${.......side},${eval:'3+3+3+4+4+3+3+5*3*3'}}
      hidden_depth: 3
      hidden_dim: 512
      output_dim: 256
      activation: "swish"
      add_input_activation: false
      add_output_activation: false

    mlp:
      units: [256, 512, 128, 64]
      activation: elu
      d2rl: False

      initializer:
        name: default
      regularizer:
        name: None

  load_checkpoint: ${if:${...checkpoint},True,False}
  load_path: ${...checkpoint}
  dexhand: ${...dexhand}

  config:
    name: ${resolve_default:DexHandImitatorXarmManus,${....experiment}}
    full_experiment_name: ${.name}
    env_name: rlgpu
    multi_gpu: ${....multi_gpu}
    ppo: True
    mixed_precision: False
    normalize_input: True
    normalize_input_excluded_keys: []
    normalize_value: True
    use_pid_control: ${....usePIDControl}
    value_bootstrap: True
    num_actors: ${....task.env.numEnvs}
    reward_shaper:
      scale_value: 1.0
    normalize_advantage: True
    gamma: 0.99
    tau: 0.95
    learning_rate: ${resolve_default:5e-4,${....learning_rate}}
    lr_schedule: adaptive
    schedule_type: standard
    kl_threshold: 0.008
    score_to_win: 10000
    max_epochs: ${resolve_default:10000,${....max_iterations}}
    early_stop_epochs: ${resolve_default:500,${....early_stop_epochs}}
    save_best_after: 10
    save_frequency: 1000
    print_stats: True
    grad_norm: 1.0
    entropy_coef: 0.0
    truncate_grads: True
    e_clip: 0.2
    horizon_length: 32
    minibatch_size: 1024
    mini_epochs: 5
    critic_coef: 4
    clip_value: True
    seq_len: 4
    bounds_loss_coef: 0.01
    use_soft_clamp: True
