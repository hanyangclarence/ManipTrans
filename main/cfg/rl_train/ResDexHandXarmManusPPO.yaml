# Non-residual Stage 2 PPO config for the arm-mounted xarm_wujihand dexhand.
# Direct 27-D action, no Stage-1-imitator base policy. Train Stage 1 with
# DexHandImitatorManusPPO first; then bootstrap Stage 2 from that checkpoint
# via `checkpoint=path/to/imitator_xarm.pth`.
#
# Target obs dim differs from ResDexHandManusPPO: object-to-joints distance
# is computed only over wuji bodies (palm + 25 finger bodies = 26) for
# arm-mounted dexhands, not over all 35 dexhand bodies. We use a fingertip-
# only target dim (5*3*3) plus a literal 26 for the obj_to_joints feature.
params:
  seed: ${...seed}
  algo:
    name: ppo

  model:
    name: ${is_sep_model:${....bimanual_mode},my_continuous_a2c_logstd}

  network:
    name: ${is_sep_model:${....bimanual_mode},dict_obs_actor_critic}
    separate: False

    space:
      continuous:
        mu_activation: None
        sigma_activation: None
        mu_init:
          name: default
        sigma_init:
          name: const_initializer
          val: 0
        fixed_sigma: True

    dict_feature_encoder:
      _target_: lib.nn.features.SimpleFeatureFusion
      extractors:
        privileged:
          # ndof + 13(obj_root_state) + 20(tip_force) + 3(obj_com) + 1(obj_weight)
          _target_: lib.nn.features.Identity
          input_dim: ${is_united_model:${.......bimanual_mode},${.......side},${eval:'${ndof:${.....dexhand}}+13+5*4+3+1'}}
        proprioception:
          _target_: lib.nn.features.Identity
          input_dim: ${is_united_model:${.......bimanual_mode},${.......side},${eval:'13+${ndof:${.....dexhand}}*3'}}
        target:
          # Stage 2 target = wrist deltas/vels (3+3+3+4+4+3+3) + 5 fingertip
          # delta_joints (5*3*3) + obj deltas/vels (3+3+3+4+4+3+3) +
          # obj_to_joints (26 wuji bodies) + gt_tips_distance (5) + bps (128).
          _target_: lib.nn.features.Identity
          input_dim: ${is_united_model:${.......bimanual_mode},${.......side},${eval:'(3+3+3+4+4+3+3) + 5*3*3 + (3+3+3+4+4+3+3) + 26 + 5 + 128'}}
      hidden_depth: 3
      hidden_dim: 512
      output_dim: 256
      activation: "swish"
      add_input_activation: false
      add_output_activation: false

    mlp:
      units: [256, 512, 128, 64]
      activation: elu
      d2rl: False

      initializer:
        name: default
      regularizer:
        name: None

  load_checkpoint: ${if:${...checkpoint},True,False}
  load_path: ${...checkpoint}
  dexhand: ${...dexhand}

  config:
    name: ${resolve_default:ResDexHandXarmManus,${....experiment}}
    full_experiment_name: ${.name}
    env_name: rlgpu
    multi_gpu: ${....multi_gpu}
    ppo: True
    mixed_precision: False
    normalize_input: True
    normalize_input_excluded_keys: []
    normalize_value: True
    use_pid_control: ${....usePIDControl}
    value_bootstrap: True
    num_actors: ${....task.env.numEnvs}
    reward_shaper:
      scale_value: 1.0
    normalize_advantage: True
    gamma: 0.99
    tau: 0.95
    learning_rate: ${resolve_default:5e-4,${....learning_rate}}
    lr_schedule: adaptive
    schedule_type: standard
    kl_threshold: 0.008
    score_to_win: 10000
    max_epochs: ${resolve_default:10000,${....max_iterations}}
    early_stop_epochs: ${resolve_default:500,${....early_stop_epochs}}
    save_best_after: 10
    save_frequency: 1000
    print_stats: True
    grad_norm: 1.0
    entropy_coef: 0.0
    truncate_grads: True
    e_clip: 0.2
    horizon_length: 32
    minibatch_size: 1024
    mini_epochs: 5
    critic_coef: 4
    clip_value: True
    seq_len: 4
    bounds_loss_coef: 0.0001
    use_soft_clamp: True
