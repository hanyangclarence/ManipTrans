# Stage 2 (manipulation) for the arm-mounted xarm_wujihand dexhand. Mirrors
# ResDexHandManus but with two key differences:
#   - drops the residual base+residual action layout; the env uses a
#     direct 27-D action (7 arm joint deltas + 20 finger joint absolute)
#     when self.dexhand.n_arm_dofs > 0
#   - reward / target obs widths use the wuji-only body subset
#     (joint_state_body_names) so they line up with the env's reduced
#     joints_state slice for arm-mounted dexhands.
name: ${concat:ResDexHandXarmManus,${..side}}

physics_engine: ${..physics_engine}
seed: ${..seed}

env:
  numEnvs: ${resolve_default:8192,${...num_envs}}
  dexhand: ${...dexhand}

  episodeLength: 1200
  training: ${if:${...test},False,True}

  usePIDControl: ${...usePIDControl}

  rolloutStateInit: ${resolve_default:False,${...rolloutStateInit}}
  randomStateInit: ${resolve_default:True,${...randomStateInit}}

  dataIndices: ${resolve_default:[],${...dataIndices}}
  obsFutureLength: 1

  rolloutLen: ${resolve_default:None,${...rolloutLen}}
  rolloutBegin: ${resolve_default:None,${...rolloutBegin}}

  clipObservations: 5.0
  clipActions: 1.0

  furniture: just_one_leg

  frankaDofNoise: 0.25

  targetLiftHeight: 0.05
  distanceReward: 0.1
  liftReward: 1.0
  successReward: 1.0

  aggregateMode: 3

  tightenMethod: "exp_decay"
  tightenFactor: 0.7
  tightenSteps: 3200

  actionScale: 1.0
  useQuatRot: false

  # Per-step joint-target delta scale for the 7 arm DOFs.
  baseActionScale: 0.025

  useFingertipsOnly: True

  propDumpInfo:
    q_rh: ${ndof:${....dexhand}}
    q_lh: ${ndof:${....dexhand}}
    dq_rh: ${ndof:${....dexhand}}
    dq_lh: ${ndof:${....dexhand}}
    state_rh: 13
    state_lh: 13
    state_manip_obj_rh: 13
    state_manip_obj_lh: 13
    joint_state_rh: ${eval:'${nbody:${....dexhand}}*13'}
    joint_state_lh: ${eval:'${nbody:${....dexhand}}*13'}
    tip_force_rh: 15
    tip_force_lh: 15
    reward: 1

  actionsMovingAverage: ${...actionsMovingAverage}
  translationScale: 1.0
  orientationScale: 0.1
  bimanual_mode: ${...bimanual_mode}

  propObsDim: ${is_both_hands:${eval:'13+${ndof:${...dexhand}}*3'},${...side}}
  obsKeys:
    - q
    - cos_q
    - sin_q
    - base_state

  privilegedObsDim: ${is_both_hands:${eval:'${ndof:${...dexhand}}+13+5*4+3+1'},${...side}}
  privilegedObsKeys:
    - dq
    - manip_obj_pos
    - manip_obj_quat
    - manip_obj_vel
    - manip_obj_ang_vel
    - tip_force
    - manip_obj_com
    - manip_obj_weight

  enableCameraSensors: False

sim:
  dt: 0.0166667
  substeps: 2
  up_axis: "z"
  use_gpu_pipeline: ${eq:${...pipeline},"gpu"}
  gravity: [0.0, 0.0, -9.81]
  physx:
    num_threads: ${....num_threads}
    solver_type: ${....solver_type}
    use_gpu: ${contains:"cuda",${....sim_device}}
    num_position_iterations: 8
    num_velocity_iterations: 1
    contact_offset: 0.005
    rest_offset: 0.0
    bounce_threshold_velocity: 0.2
    max_depenetration_velocity: 1000.0
    default_buffer_size_multiplier: 5.0
    max_gpu_contact_pairs: 1048576
    num_subscenes: ${....num_subscenes}
    contact_collection: 1

task:
  randomize: ${if:${...test},False,True}
  randomization_params:
    frequency: 32
    sim_params:
      gravity:
        operation: "scaling"
        schedule: "linear_decay"
        schedule_steps: 1920
        external_sample:
          type: "const_scale"
          init_value: 0
    actor_params:
      manip_obj:
        color: True
        rigid_shape_properties:
          friction:
            num_buckets: 250
            operation: "scaling"
            schedule: "linear_decay"
            schedule_steps: 1920
            external_sample:
              type: "const_scale"
              init_value: 3
              upper_bound: 6.0
              lower_bound: 1.0
